[project]
name = "minimal-agora"
version = "0.1.0"
description = "Counterfactual world simulation engine using LLM agent debate"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "anthropic>=0.40.0",
]
litellm = [
    "litellm>=1.40",
]
viz = [
    "matplotlib>=3.8",
    "manim>=0.18",
    "plotly>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "matplotlib>=3.8",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    # Provider extras are needed at test time so the patch-based provider
    # tests have the `anthropic` / `litellm` module attributes to patch.
    "anthropic>=0.40.0",
    "litellm>=1.40",
    "plotly>=5.0",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_agora"]

[project.scripts]
minimal-agora = "minimal_agora.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
